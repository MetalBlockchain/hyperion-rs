# Development stack: single-node Elasticsearch + hyperion indexer + API.
#
# nodeos itself is NOT part of this stack — point config/docker.toml at your
# state-history-enabled node (defaults to the docker host via
# host.docker.internal).
#
#   docker compose up --build
#   curl http://localhost:7000/v2/health

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  indexer:
    build: .
    command: ["indexer", "-c", "/etc/hyperion/config.toml"]
    volumes:
      - ./config/docker.toml:/etc/hyperion/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: ["api", "-c", "/etc/hyperion/config.toml"]
    volumes:
      - ./config/docker.toml:/etc/hyperion/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7000:7000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  esdata:
