# Development stack: single-node ClickHouse + hyperion indexer + API.
#
# nodeos itself is NOT part of this stack — point config/docker.toml at your
# state-history-enabled node (defaults to the docker host via
# host.docker.internal).
#
#   docker compose up --build
#   curl http://localhost:7000/v2/health

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - chdata:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  indexer:
    build: .
    command: ["indexer", "-c", "/etc/hyperion/config.toml"]
    volumes:
      - ./config/docker.toml:/etc/hyperion/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: ["api", "-c", "/etc/hyperion/config.toml"]
    volumes:
      - ./config/docker.toml:/etc/hyperion/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7000:7000"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chdata:
